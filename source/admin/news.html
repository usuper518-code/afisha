<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Управление тегами | Либретто Админ</title>
        <link rel="icon" href="/favicon.ico" type="image/x-icon">
        <link rel="stylesheet" href="/admin/css/common.css">
        <link rel="stylesheet" href="/admin/css/admin-style.css">
    </head>
    <body>
        <header>
            <div class="container header-inner">
                <div class="logo"><a href="/admin/">АДМИН-ПАНЕЛЬ</a></div>
                <nav></nav>
            </div>
        </header>

        <main class="container">
            <div class="page-header">
                <h2>Теги</h2>
                <div class="page-header-actions">
                    <div class="list-controls">
                        <input type="text" id="search-input" placeholder="Заголовок" class="search-input">
                        <button type="button" id="search-btn" class="btn">Найти</button>
                        <button type="button" id="reset-search-btn" class="btn btn-cancel">Сбросить</button>
                    </div>
                    <a href="/admin/news-form.html" class="btn" title="Новый">➕ Новый</a>
                </div>
            </div>

            <table class="admin-table">
                <thead><tr></tr></thead>
                <tbody id="data-table"></tbody>
            </table>

            <div class="list-footer">
                <div id="total-info" class="total-info">Всего: 0</div>
                <div id="pagination" class="pagination"></div>
            </div>
        </main>

        <script src="/admin/js/common.js"></script>
        <script src="/admin/js/admin-script.js"></script>
        <script src="/admin/js/list-manager.js"></script>
        <script>
            initListManager({
                endpoint: '/news',
                obj: 'news',
                objName: 'Новость',
                objNamePlural: 'Новости',
                fields: 'id,title,created_at,is_published',
                titleField: 'title', //выводится при удалении
                limit: 10,
                actionWidth: '7%',
                columns: [
                    {field: 'id', label: 'ID', width: '8%'},
                    {field: 'title', label: 'Заголовок', width: '53%', link: true},
                    {field: 'created_at', label: 'Дата', width: '20%', format: 'date'},
                    {field: 'is_published', label: 'Опубл.', width: '7%', format: 'boolean'}
                ]
            });</script>
    </body>
</html>
